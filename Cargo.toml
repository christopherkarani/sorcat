[workspace]
members = [
    "crates/sorcat-core",
    "crates/sorcat-soroban-knowledge",
    "crates/sorcat-wat-backend",
    "crates/sorcat-rust-backend",
    "crates/sorcat-eval",
    "crates/sorcat-cli",
]
resolver = "2"

[workspace.package]
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/example/sorcat"
rust-version = "1.87"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
indexmap = "2.7"
itertools = "0.14"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
wasmparser = "0.240"
wasmprinter = "0.240"
wat = "1.240"
