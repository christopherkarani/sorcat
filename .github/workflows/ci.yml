name: ci

on:
  push:
  pull_request:

jobs:
  test-and-score:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run Workspace Tests
        run: cargo test --workspace --no-fail-fast

      - name: Verify Locked-Corpus Thresholds
        run: cargo run -p sorcat-cli -- score
